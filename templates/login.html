<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide Navbar</title>
    <link rel="stylesheet" type="text/css" href="slide navbar style.css">
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@500&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="stylesheet" href="../static/style.css">
</head>
<body>

    <svg id="svgAnimation" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="50" height="50">
        <circle cx="50" cy="50" r="30" fill="white" stroke="#573b8a" stroke-width="5" />
    </svg>

    <div id="preloader">
        <div class="spinner"></div>
    </div>

    <div class="form-container">
        <div class="main">
            <input type="checkbox" id="chk" aria-hidden="true">

            <div class="signup">
                <form method="POST" action="/register_user" onsubmit="submitForm(event)">

                    <label for="chk" aria-hidden="true">Sign up</label>
                    <input type="text" name="txt" placeholder="User name" required=""/>
                    <input type="email" name="email" placeholder="Email" required=""/>
                    <input type="number" name="broj" placeholder="Phone Number" required=""/>
                    <input type="password" name="pswd" placeholder="Password" required=""/>
                    <button>Sign up</button>
                </form>
            </div>

            <div class="login">
                <form id="loginForm">
                    <label for="chk" aria-hidden="true">Login</label>
                    <input type="email" name="email" placeholder="Email" required=""/>
                    <input type="password" name="pswd" placeholder="Password" required=""/>
                    <button>Login</button>

                    <div id="progress-container" style="display:none;">
                        <div class="progress-circle"></div>
                    </div>
                    <div class="google-login mt-4">
                        <div id="google-signin-button"></div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        window.onload = function() {
            setTimeout(function() {
                document.getElementById("preloader").style.display = "flex"; 
                setTimeout(function() {
                    document.getElementById("preloader").style.display = "none"; 
                    document.querySelector('.form-container').classList.add('show'); 
                }, 1000);
            }, 1000); 
        };

        function submitForm(event) {
            event.preventDefault(); // Prevent the default form submission

            const formData = new FormData(event.target);
            const data = {
                username: formData.get('txt'),
                email: formData.get('email'),
                phone: formData.get('broj'),
                password: formData.get('pswd')
            };

            fetch('/register_user', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(data => {
                console.log('Server response:', data);
                
                if (data.success) { 
                    document.getElementById('chk').checked = true; 
                } else {
                    alert('Registration failed. Please try again.');
                }
            })
            .catch(error => console.error('Error:', error));
        }

        // Login form submission
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault(); 

            const formData = new FormData(this);
            const data = {
                email: formData.get('email'),
                password: formData.get('pswd')
            };

            showProgress(); // Show the progress circle when submitting

            fetch('/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json', 
                },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    window.location.href = 'index.html'; 
                } else {
                    alert('Incorrect email or password. Please try again.');
                    document.getElementById('progress-container').style.display = 'none'; // Hide progress circle if login fails
                }
            })
            .catch(error => {
                console.error('Error during login:', error);
                alert('An error occurred during login.');
                document.getElementById('progress-container').style.display = 'none'; 
            });
        });

        // Show progress circle when the form is submitted
        function showProgress() {
            document.getElementById('progress-container').style.display = 'block';
        }
    </script>

</body>
</html>

<style>
    #progress-container {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .progress-circle {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #3498db;
        border-radius: 50%;
        width: 50px;
        height: 50px;
        animation: spin 2s linear infinite;
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
</style>
